name: Release Bison

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish Windows version
        run: dotnet publish Bison.CLI.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64

      - name: Publish Linux version
        run: dotnet publish Bison.CLI.csproj -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o publish/linux-x64

      - name: Publish macOS version
        run: dotnet publish Bison.CLI.csproj -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o publish/osx-x64

      - name: Zip executables
        run: |
          zip -j Bison-win-x64.zip publish/win-x64/Bison.CLI.exe
          zip -j Bison-linux-x64.zip publish/linux-x64/Bison.CLI
          zip -j Bison-osx-x64.zip publish/osx-x64/Bison.CLI

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Bison-win-x64.zip \
            Bison-linux-x64.zip \
            Bison-osx-x64.zip