name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Bison.CLI/Bison.CLI.csproj

      - name: Build
        run: dotnet build src/Bison.CLI/Bison.CLI.csproj --no-restore

      - name: Test
        run: dotnet test src/Bison.CLI/Bison.CLI.csproj --no-build