name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Dafny
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Verify and generate Dafny code
        run: |
          dafny translate cs src/Bison.Dafny/TaxonFilter.dfy \
            --include-runtime false \
            --output src/Bison.Razor/Verified/TaxonFilter.cs

      - name: Restore dependencies
        run: dotnet restore Bison.sln

      - name: Build
        run: dotnet build Bison.sln --no-restore

      - name: Test
        run: dotnet test Bison.sln --no-build