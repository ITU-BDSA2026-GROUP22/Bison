# Maps changed file paths to PR labels (used by pr-labeler.yml)
database:
  - changed-files:
      - any-glob-to-any-file: 'src/Database/**'

cli:
  - changed-files:
      - any-glob-to-any-file: 'src/Bison.CLI/**'

ci/cd:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'

documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

data:
  - changed-files:
      - any-glob-to-any-file: '**/*.csv'
